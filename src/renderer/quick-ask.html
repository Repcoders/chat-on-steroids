<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <link rel="stylesheet" href="./quick-ask.css" />
  <title>Quick ask</title>
</head>
<body>
  <main class="quick-ask">
    <form id="form" class="ask">
      <textarea id="text" rows="3" spellcheck="true"></textarea>
      <div class="row">
        <select id="project"></select>
        <button id="send" type="submit"></button>
      </div>
    </form>
    <section id="result" class="result" aria-live="polite" hidden>
      <p id="question" class="question"></p>
      <p id="status" class="status"></p>
      <div id="answer" class="answer"></div>
      <button id="open" class="link" type="button"></button>
    </section>
  </main>
  <script type="module" src="./quick-ask.ts"></script>
</body>
</html>
